[project]
name = "qobuz-mcp"
version = "0.1.0"
description = "Local MCP server to explore the Qobuz catalog and manage a Qobuz library."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx2>=2.16.0",
    "keyring>=25.7.0",
    "pydantic>=2.14.3",
]

[project.scripts]
qobuz-mcp = "qobuz_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13,<0.14"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "scripts"

[tool.coverage.run]
source = ["qobuz_mcp"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["--strict-markers"]
markers = ["live: calls the real Qobuz API, read-only"]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "coverage>=7.17.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
